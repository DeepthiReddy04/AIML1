<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        h1{ 
            font-style: italic;
            font-weight:bold;
            font-size: 80px;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        
        }
        .f1{ 
            color:indigo;
        }
        p{ 
            font-style:oblique;
            font-weight: bolder;
            font-size: 30px;
            font-family:Arial, Helvetica, sans-serif ;
        }
        .f2{ 
            color:darkmagenta;
        }
        a:link{
            color: orange;
        }
        a:visited{

        a:hover{
            color: olive;
        }
        a:active{
            color: black;
        }

    </style>
</head>
<body>
<h1 class="a f1">Welcome</h1>
<p class="d f2">This is my web page</p>

</html>
